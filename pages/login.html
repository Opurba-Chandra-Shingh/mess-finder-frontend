<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mess Finder</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Auth shell: an empty page with one card in the middle -->
    <main id="page" class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center px-4 py-8">
        <a href="../index.html" class="mb-6 flex items-center justify-center gap-2 text-2xl font-semibold">
            <i class="fa-solid fa-house-chimney-window text-ochre"></i> Mess Finder
        </a>

        <div class="rounded-xl border border-line bg-white p-6 shadow-sm">
            <h1 class="text-xl font-semibold">Login</h1>
            <p class="mt-1 text-sm text-ink-soft">Welcome back. Enter your email and password.</p>

            <!-- the red message for a wrong password, a blocked account, a stopped server... -->
            <div id="form-message" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert"></div>
            <div id="expired-message" class="mt-4 hidden rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
                Your login has ended. Please login again.
            </div>

            <form id="login-form" class="mt-5 space-y-4" novalidate>
                <div>
                    <label for="email" class="mb-1 block text-sm font-medium">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"
                        class="h-11 w-full rounded-lg border border-line bg-white px-3 text-sm placeholder:text-mute focus:border-ochre focus:outline-none focus:ring-2 focus:ring-ochre/40">
                    <p data-error-for="email" class="mt-1 text-xs text-red-600"></p>
                </div>

                <div>
                    <label for="password" class="mb-1 block text-sm font-medium">Password</label>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password"
                            class="h-11 w-full rounded-lg border border-line bg-white px-3 pr-11 text-sm placeholder:text-mute focus:border-ochre focus:outline-none focus:ring-2 focus:ring-ochre/40">
                        <button type="button" id="toggle-password" class="absolute right-1 top-1 h-9 w-9 rounded-lg text-ink-soft hover:bg-page" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p data-error-for="password" class="mt-1 text-xs text-red-600"></p>
                </div>

                <button type="submit" id="login-button"
                    class="h-11 w-full rounded-lg bg-espresso text-sm font-medium text-white hover:bg-espresso-hover disabled:opacity-70">
                    Login
                </button>
            </form>

            <p class="mt-5 text-center text-sm text-ink-soft">
                New here? <a id="register-link" href="register.html" class="font-medium text-link hover:underline">Create an account</a>
            </p>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
